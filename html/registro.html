<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <main>
        <h1>Formulario de Registro</h1>

        <form action="#" method="POST">

            <!-- 1. Nombre completo -->
            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required tabindex="1">
            </div>

            <br>

            <!-- 2. Correo electrónico -->
            <div>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="Ej: correo@ejemplo.com" required tabindex="2">
            </div>

            <br>

            <!-- 3. Contraseña -->
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required tabindex="3">
            </div>

            <br>

            <!-- 4. Selección de género -->
            <fieldset>
                <legend>Género:</legend>
                <input type="radio" id="genero-m" name="genero" value="masculino" tabindex="4">
                <label for="genero-m">Masculino</label>

                <input type="radio" id="genero-f" name="genero" value="femenino" tabindex="5">
                <label for="genero-f">Femenino</label>

                <input type="radio" id="genero-o" name="genero" value="otro" tabindex="6">
                <label for="genero-o">Otro</label>
            </fieldset>

            <br>

            <!-- 5. Intereses -->
            <fieldset>
                <legend>Intereses:</legend>
                <input type="checkbox" id="musica" name="intereses" value="musica" tabindex="7">
                <label for="musica">Música</label>

                <input type="checkbox" id="deporte" name="intereses" value="deporte" tabindex="8">
                <label for="deporte">Deporte</label>

                <input type="checkbox" id="lectura" name="intereses" value="lectura" tabindex="9">
                <label for="lectura">Lectura</label>
            </fieldset>

            <br>

            <!-- 6. País -->
            <div>
                <label for="pais">País:</label>
                <select id="pais" name="pais" required tabindex="10">
                    <option value="">-- Seleccione una opción --</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                </select>
            </div>

            <br>

            <!-- 7. Comentarios adicionales -->
            <div>
                <label for="comentarios">Comentarios adicionales:</label><br>
                <textarea id="comentarios" name="comentarios" placeholder="Escribe tu mensaje aquí..." rows="4" cols="40" tabindex="11"></textarea>
            </div>

            <br>

            <!-- 8. Botón de envío -->
            <div>
                <input type="submit" value="Registrarse" tabindex="12">
            </div>

        </form>
    </main>

</body>
</html>
